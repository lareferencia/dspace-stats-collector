[bumpversion]
current_version = 1.0.0
commit = True
tag = True

[bumpversion:file:dspace_stats_collector/version.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs

[aliases]
# Define setup.py command aliases here
test = pytest

[tool:pytest]
